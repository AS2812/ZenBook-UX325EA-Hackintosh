<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">ZenBook 13 OLED - macOS Sonoma</title>
  <desc id="d">OpenCore EFI and patched drivers for the ASUS ZenBook 13 OLED UX325EA: Iris Xe Metal acceleration, real OLED brightness, Wi-Fi 6, all hotkeys.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.55" stop-color="#0f1630"/>
      <stop offset="1" stop-color="#1a1240"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.78" cy="0.42" r="0.45">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.12" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#00c2ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#00c2ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5fa2"/>
      <stop offset="0.35" stop-color="#8b5cff"/>
      <stop offset="0.7" stop-color="#2d7dff"/>
      <stop offset="1" stop-color="#00d4c8"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3150"/>
      <stop offset="1" stop-color="#151a2e"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4266"/>
      <stop offset="1" stop-color="#1b2038"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9c2ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="22" fill="url(#grid)"/>
  <rect width="1280" height="420" rx="22" fill="url(#glowA)"/>
  <rect width="1280" height="420" rx="22" fill="url(#glowB)"/>

  <!-- laptop -->
  <g transform="translate(790 70)">
    <ellipse cx="200" cy="298" rx="235" ry="16" fill="#000" opacity="0.45" filter="url(#soft)"/>
    <rect x="18" y="0" width="364" height="236" rx="14" fill="url(#lid)" stroke="#4b5482" stroke-width="1.5"/>
    <rect x="32" y="14" width="336" height="206" rx="6" fill="#05060c"/>
    <rect x="36" y="18" width="328" height="198" rx="4" fill="url(#screen)" opacity="0.92"/>
    <!-- wallpaper waves -->
    <path d="M36 150 C 110 110, 170 190, 250 140 S 340 120, 364 132 V 216 H 36 Z" fill="#0b1030" opacity="0.35"/>
    <path d="M36 178 C 120 150, 190 210, 270 172 S 345 160, 364 168 V 216 H 36 Z" fill="#0b1030" opacity="0.45"/>
    <!-- menu bar + dock -->
    <rect x="36" y="18" width="328" height="12" rx="2" fill="#ffffff" opacity="0.18"/>
    <rect x="132" y="192" width="136" height="16" rx="6" fill="#ffffff" opacity="0.22"/>
    <g fill="#ffffff" opacity="0.75">
      <circle cx="148" cy="200" r="4.5"/><circle cx="166" cy="200" r="4.5"/><circle cx="184" cy="200" r="4.5"/>
      <circle cx="202" cy="200" r="4.5"/><circle cx="220" cy="200" r="4.5"/><circle cx="238" cy="200" r="4.5"/><circle cx="254" cy="200" r="4.5"/>
    </g>
    <!-- window -->
    <rect x="86" y="52" width="170" height="104" rx="7" fill="#ffffff" opacity="0.16" stroke="#ffffff" stroke-opacity="0.35"/>
    <circle cx="98" cy="63" r="3" fill="#ff6b6b"/><circle cx="108" cy="63" r="3" fill="#ffd166"/><circle cx="118" cy="63" r="3" fill="#06d6a0"/>
    <rect x="98" y="80" width="96" height="6" rx="3" fill="#ffffff" opacity="0.55"/>
    <rect x="98" y="94" width="140" height="5" rx="2.5" fill="#ffffff" opacity="0.3"/>
    <rect x="98" y="106" width="120" height="5" rx="2.5" fill="#ffffff" opacity="0.3"/>
    <rect x="98" y="118" width="132" height="5" rx="2.5" fill="#ffffff" opacity="0.3"/>
    <!-- base -->
    <path d="M0 238 H400 L388 262 Q386 266 380 266 H20 Q14 266 12 262 Z" fill="url(#deck)" stroke="#4b5482" stroke-width="1.5"/>
    <rect x="168" y="238" width="64" height="7" rx="3.5" fill="#0d1124"/>
  </g>

  <!-- text -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="112" font-size="20" font-weight="600" fill="#9aa6ff" letter-spacing="3">ASUS UX325EA · HACKINTOSH</text>
    <text x="70" y="178" font-size="58" font-weight="800" fill="url(#title)">ZenBook 13 OLED</text>
    <text x="72" y="222" font-size="27" font-weight="500" fill="#d7dcff">macOS Sonoma on Tiger Lake, done properly.</text>

    <g font-size="17" font-weight="600">
      <g transform="translate(72 262)">
        <rect width="172" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#8b7dff" stroke-opacity="0.7"/>
        <circle cx="22" cy="19" r="5" fill="#8b7dff"/>
        <text x="36" y="25" fill="#e9e6ff">Iris Xe · Metal</text>
      </g>
      <g transform="translate(256 262)">
        <rect width="190" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#ff6fae" stroke-opacity="0.7"/>
        <circle cx="22" cy="19" r="5" fill="#ff6fae"/>
        <text x="36" y="25" fill="#ffe6f1">Real OLED nits</text>
      </g>
      <g transform="translate(458 262)">
        <rect width="186" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#2fd3ff" stroke-opacity="0.7"/>
        <circle cx="22" cy="19" r="5" fill="#2fd3ff"/>
        <text x="36" y="25" fill="#e2f8ff">Wi-Fi 6 · BT</text>
      </g>
      <g transform="translate(72 312)">
        <rect width="190" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#3ddc97" stroke-opacity="0.7"/>
        <circle cx="22" cy="19" r="5" fill="#3ddc97"/>
        <text x="36" y="25" fill="#e3fff2">All Fn hotkeys</text>
      </g>
      <g transform="translate(274 312)">
        <rect width="172" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#ffc65c" stroke-opacity="0.7"/>
        <circle cx="22" cy="19" r="5" fill="#ffc65c"/>
        <text x="36" y="25" fill="#fff3dc">Sleep &amp; wake</text>
      </g>
      <g transform="translate(458 312)">
        <rect width="186" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#b8c2e6" stroke-opacity="0.6"/>
        <circle cx="22" cy="19" r="5" fill="#b8c2e6"/>
        <text x="36" y="25" fill="#eef1ff">OpenCore 1.0.8</text>
      </g>
    </g>
  </g>
</svg>
